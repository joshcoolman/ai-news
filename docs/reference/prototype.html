  Reference prototype for the feed page. Open this file in a browser.
  It is a static mock: the cards are hard-coded, and the remove and magnifier
  buttons only copy text to the clipboard (in the prototype that text was pasted
  into a chat, where the search was done by hand). The app replaces both with
  real server calls. Match its layout, card anatomy and behaviour, not its code.
-->

<title>AI Feed Picker</title>

<style>
/* Layout: a video-site home grid, newest batch first; each card can be removed, a fixed tray at the bottom lists what was removed and mirrors the clipboard. */
:root {
  --bg: #ffffff;
  --fg: #0f0f0f;
  --muted: #606060;
  --thumb-ink: #ffffff;
  --chip: #f2f2f2;
  --line: #e5e5e5;
  --pick: #cc0000;
  --tray: #ffffff;
  --font: "Roboto", "Helvetica Neue", Arial, sans-serif;
  --mono: "Roboto Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f0f0f; --fg: #f1f1f1; --muted: #aaaaaa; --thumb-ink: #ffffff;
    --chip: #272727; --line: #303030; --pick: #ff4e45; --tray: #181818;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f0f0f; --fg: #f1f1f1; --muted: #aaaaaa; --thumb-ink: #ffffff;
  --chip: #272727; --line: #303030; --pick: #ff4e45; --tray: #181818;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--font); }
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 170px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 18px; }
h1 { font-size: 20px; font-weight: 700; margin: 0; }
header p { margin: 0; color: var(--muted); font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 28px 16px; }
.card { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.thumb {
  position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 10px; overflow: hidden;
  background: linear-gradient(135deg, hsl(var(--h) 55% 34%), hsl(calc(var(--h) + 40) 60% 18%));
  display: flex; align-items: center; justify-content: center;
  color: var(--thumb-ink); font-weight: 700; font-size: 30px; letter-spacing: -0.02em; text-align: center; padding: 12px;
}
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hit { position: absolute; inset: 0; }
.hit:focus-visible { outline: 3px solid var(--thumb-ink); outline-offset: -3px; }
.thumb:hover { filter: brightness(1.12); }
.badge {
  pointer-events: none; position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.8); color: #fff;
  font: 500 12px var(--mono); padding: 2px 5px; border-radius: 4px;
}
.new-tag {
  pointer-events: none; position: absolute; left: 6px; top: 6px; background: var(--pick); color: #fff;
  font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 4px;
}
.remove {
  position: absolute; right: 6px; top: 6px; width: 30px; height: 30px; border-radius: 50%;
  border: 0; background: rgba(0,0,0,.7); color: #fff; font: 500 18px/1 var(--font); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.remove:hover { background: var(--pick); }
.more {
  position: absolute; left: 6px; bottom: 6px; width: 30px; height: 30px; border-radius: 50%;
  border: 0; background: rgba(0,0,0,.7); color: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.more:hover { background: #fff; color: #0f0f0f; }
.more:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.remove:focus-visible, .restore:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.title { font-size: 16px; font-weight: 500; line-height: 1.35; text-wrap: balance; }
.title a { color: inherit; text-decoration: none; }
.title a:hover, .title a:focus-visible { text-decoration: underline; }
.meta { font-size: 13px; color: var(--muted); line-height: 1.4; }
.empty { color: var(--muted); font-size: 14px; }
.tray {
  position: fixed; left: 0; right: 0; bottom: 0; background: var(--tray); border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
}
.tray-in { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; }
.status { font-size: 13px; color: var(--muted); }
.status b { color: var(--fg); font-weight: 500; }
.restore {
  background: var(--chip); color: var(--fg); border: 1px solid var(--line); border-radius: 16px;
  font: 500 13px var(--font); padding: 5px 12px; cursor: pointer;
}
textarea {
  width: 100%; box-sizing: border-box; height: 72px; resize: none; background: var(--chip); color: var(--fg);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: 500 12px/1.5 var(--mono);
}
</style>

<div class="wrap">
  <header>
    <h1>AI this week</h1>

<div class="tray">

</div>

const KEY = "ai-feed-removed";
let removed = [];
try { removed = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { removed = []; }
if (!Array.isArray(removed)) removed = [];

const grid = document.getElementById("grid");
const out = document.getElementById("out");
const status = document.getElementById("status");
const restore = document.getElementById("restore");
const empty = document.getElementById("empty");

function hue(id) { let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(removed)); } catch (e) {} }
function removedText() {
  return removed.map(id => items.find(x => x.id === id)).filter(Boolean)
    .map(x => "- [" + x.thumb + "] " + x.title).join("\n");
}

function render() {
  grid.textContent = "";
  const visible = items.filter(x => !removed.includes(x.id));
  const shown = [];
  items.filter(x => !x.after).forEach(x => {
    if (visible.includes(x)) shown.push(x);
    visible.filter(c => c.after === x.id).forEach(c => shown.push(c));
  });
  shown.forEach(x => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML =
      '<div class="thumb" style="--h:' + hue(x.id) + '">' +
        (x.batch === LATEST ? '<span class="new-tag">New</span>' : "") +
        '<span class="label"></span>' +
        '<button class="remove" type="button">&times;</button>' +
        '<button class="more" type="button"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></button>' +
        '<span class="badge"></span></div>' +
      '<div class="title"></div><div class="meta"></div>';
    /* A real video shows its own YouTube thumbnail and no label text. */
    const vid = x.url && x.url.split("v=")[1];
    const thumbEl = card.querySelector(".thumb");
    if (vid) {
      const img = document.createElement("img");
      img.src = "https://i.ytimg.com/vi/" + vid + "/mqdefault.jpg";
      img.alt = "";
      thumbEl.prepend(img);
    } else card.querySelector(".label").textContent = x.thumb;
    card.querySelector(".badge").textContent = x.len;
    /* A video opens on YouTube; every other card opens its source. Both open in a new tab. */
    const link = x.url || x.src;
    const titleEl = card.querySelector(".title");
    if (link) {
      const hit = document.createElement("a");
      hit.className = "hit"; hit.href = link; hit.target = "_blank"; hit.rel = "noopener";
      hit.setAttribute("aria-label", "Open: " + x.title);
      thumbEl.insertBefore(hit, thumbEl.querySelector(".remove"));
      const a = document.createElement("a");
      a.href = link; a.target = "_blank"; a.rel = "noopener"; a.textContent = x.title;
      titleEl.appendChild(a);
    } else titleEl.textContent = x.title;
    let host = "";
    if (x.src) { try { host = new URL(x.src).hostname.replace(/^www\./, ""); } catch (e) {} }
    const parent = x.after && items.find(p => p.id === x.after);
    card.querySelector(".meta").textContent =
      (parent ? "More like " + parent.thumb + " · " : "") + x.meta + (host ? " · " + host : "");
    /* The magnifier copies a "more like this" request; pasted into the chat, it gets up to four results inserted after this card. */
    const more = card.querySelector(".more");
    more.setAttribute("aria-label", "More like this: " + x.title);
    more.title = "More like this";
    more.addEventListener("click", () => {
      const req = "More like this (4 from YouTube, insert after it):\n[" + x.thumb + "] " + x.title + "\nid: " + x.id + (link ? "\n" + link : "");
      const done = ok => {
        status.innerHTML = ok
          ? "<b>Copied a request for more like " + x.thumb.replace(/[<&]/g, "") + ".</b> Paste it in the chat."
          : "<b>Copy was blocked here.</b> The request below is selected, press Cmd+C.";
        if (!ok) { out.value = req; out.focus(); out.select(); }
      };
      try { navigator.clipboard.writeText(req).then(() => done(true), () => done(false)); }
      catch (e) { done(false); }
    });
    const btn = card.querySelector(".remove");
    btn.setAttribute("aria-label", "Remove: " + x.title);
    btn.title = "Remove";
    btn.addEventListener("click", () => { removed.push(x.id); save(); render(); copy(); });
    grid.appendChild(card);
  });
  empty.hidden = shown.length > 0;
  const text = removedText();
  out.value = text ? "Removed:\n" + text : "";
  restore.hidden = removed.length === 0;
  if (!removed.length) status.innerHTML = "<b>Nothing removed.</b>";
  else status.innerHTML = "<b>" + removed.length + " removed.</b>";
}

function copy() {
  const n = removed.length;
  const done = ok => {
    if (!n) return;
    status.innerHTML = ok
      ? "<b>" + n + " removed</b>, list copied to clipboard."
      : "<b>" + n + " removed.</b> Copy was blocked here; the text below is selected, press Cmd+C.";
    if (!ok) { out.focus(); out.select(); }
  };
  try { navigator.clipboard.writeText(out.value || " ").then(() => done(true), () => done(false)); }
  catch (e) { done(false); }
}

restore.addEventListener("click", () => { removed = []; save(); render(); });
render();
</script>
